<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05060b;
    --line: rgba(255,255,255,0.08);
    --text: #f3f5fa;
    --muted: #93a0b4;
    --blue: #5b8cff;
    --violet: #9b6bff;
    --glow: rgba(91,140,255,0.35);
    --mx: 50%;
    --my: 30%;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    font-family:'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    cursor: default;
  }

  .spotlight{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    background: radial-gradient(600px circle at var(--mx) var(--my), rgba(91,140,255,0.10), transparent 55%);
    transition: background .05s linear;
  }

  .aurora{
    position:absolute;
    top:50%; left:50%;
    width:1100px; height:1100px;
    transform: translate(-50%,-50%);
    background: conic-gradient(from 0deg,
      rgba(91,140,255,0.16),
      rgba(155,107,255,0.16),
      rgba(91,140,255,0.05),
      rgba(155,107,255,0.16),
      rgba(91,140,255,0.16));
    filter: blur(80px);
    opacity:0.55;
    animation: spin 40s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes spin{
    to{ transform: translate(-50%,-50%) rotate(360deg); }
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    pointer-events:none;
    opacity:0.5;
    transition: transform .3s ease-out;
  }
  .blob.b1{
    width:520px; height:520px;
    top:-180px; left:-120px;
    background: radial-gradient(circle, var(--blue), transparent 70%);
    animation: drift1 14s ease-in-out infinite;
  }
  .blob.b2{
    width:560px; height:560px;
    top:80px; right:-200px;
    background: radial-gradient(circle, var(--violet), transparent 70%);
    animation: drift2 17s ease-in-out infinite;
  }
  .blob.b3{
    width:420px; height:420px;
    bottom:-160px; left:38%;
    background: radial-gradient(circle, #4fd3c4, transparent 70%);
    animation: drift3 20s ease-in-out infinite;
    opacity:0.28;
  }

  @keyframes drift1{
    0%,100%{ margin: 0 0; }
    50%{ margin: 30px 40px; }
  }
  @keyframes drift2{
    0%,100%{ margin: 0 0; }
    50%{ margin: -25px -35px; }
  }
  @keyframes drift3{
    0%,100%{ margin: 0 0; }
    50%{ margin: -20px 30px; }
  }

  .particles{
    position:absolute; inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .particles span{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background: #9db8ff;
    opacity:0;
    animation: twinkle 5s ease-in-out infinite;
  }

  @keyframes twinkle{
    0%{ opacity:0; transform: translateY(0) scale(0.6); }
    50%{ opacity:0.9; transform: translateY(-16px) scale(1); }
    100%{ opacity:0; transform: translateY(-32px) scale(0.6); }
  }

  .grid-overlay{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, black 40%, transparent 100%);
    pointer-events:none;
  }

  nav{
    position:relative;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border-bottom:1px solid var(--line);
    opacity:0;
    animation: dropIn .6s ease forwards;
  }

  .brand{ display:flex; align-items:center; gap:11px; }

  .brand .mark{
    width:36px; height:36px;
    border-radius:10px;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:13px;
    box-shadow: 0 6px 18px -6px rgba(91,140,255,0.6);
    overflow:hidden;
  }
  .brand .mark img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .brand .name{
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:14.5px;
    color: var(--text);
  }

  .nav-right{ display:flex; align-items:center; gap:18px; }

  .nav-cta{
    position:relative;
    overflow:hidden;
    text-decoration:none;
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:#fff;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    padding:9px 18px;
    border-radius:10px;
    transition: transform .15s ease, box-shadow .15s ease;
    cursor:pointer;
    border:0;
  }
  .nav-cta:hover{ transform: translateY(-2px); box-shadow: 0 10px 22px -8px var(--glow); }

  main{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 78px 22px 100px;
    max-width:640px;
    margin:0 auto;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:999px;
    background: rgba(91,140,255,0.08);
    border:1px solid rgba(91,140,255,0.3);
    color:#a9c0ff;
    font-size:12.5px;
    letter-spacing:0.3px;
    margin-bottom:28px;
    opacity:0;
    animation: fadeUp .6s ease forwards .15s;
  }
  .badge .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--blue);
    box-shadow: 0 0 10px var(--blue);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ box-shadow: 0 0 0 0 rgba(91,140,255,0.55); }
    50%{ box-shadow: 0 0 0 6px rgba(91,140,255,0); }
  }

  h1{
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size: clamp(32px, 8vw, 50px);
    line-height:1.1;
    letter-spacing:-0.5px;
    margin-bottom:22px;
  }

  h1 .line{ display:block; opacity:0; }
  h1 .line1{ animation: slideInLeft .65s cubic-bezier(.2,.8,.2,1) forwards .28s; }
  h1 .line2{ animation: slideInRight .65s cubic-bezier(.2,.8,.2,1) forwards .42s; }
  h1 .line3{
    background: linear-gradient(90deg, var(--blue), var(--violet), var(--blue));
    background-size: 200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: slideInLeft .65s cubic-bezier(.2,.8,.2,1) forwards .56s,
               shimmer 4s linear infinite 1.2s;
  }
  @keyframes shimmer{
    to{ background-position: -200% center; }
  }

  p.sub{
    color: var(--muted);
    font-size:15.5px;
    line-height:1.65;
    max-width:440px;
    margin-bottom:36px;
    opacity:0;
    animation: fadeUp .6s ease forwards .7s;
  }

  .actions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    width:100%;
    max-width:340px;
  }

  .cta-btn{
    position:relative;
    overflow:hidden;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:#fff;
    background: linear-gradient(135deg, var(--blue), var(--violet));
    padding:17px 22px;
    border-radius:14px;
    box-shadow: 0 18px 36px -14px var(--glow);
    opacity:0;
    transform: translateY(18px);
    animation: fadeUp .6s ease forwards .88s;
    transition: transform .18s ease, box-shadow .18s ease;
    border:0;
    cursor:pointer;
  }
  .cta-btn:hover{ transform: translateY(-3px); box-shadow: 0 22px 42px -12px var(--glow); }
  .cta-btn .arrow{ transition: transform .18s ease; }
  .cta-btn:hover .arrow{ transform: translateX(5px); }

  .cta-btn::before{
    content:"";
    position:absolute;
    top:0; left:-70%;
    width:40%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    transition: left .6s ease;
  }
  .cta-btn:hover::before{ left:130%; }

  .ripple{
    position:absolute;
    border-radius:50%;
    background: rgba(255,255,255,0.55);
    transform: scale(0);
    animation: rippleAnim .6s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{
    to{ transform: scale(3.2); opacity:0; }
  }

  a.secondary{
    color: var(--muted);
    font-size:14px;
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    opacity:0;
    animation: fadeUp .6s ease forwards 1.02s;
    transition: color .15s ease, border-color .15s ease;
  }
  a.secondary b{ color:#c8d3e6; font-weight:600; }
  a.secondary:hover{ color:#c8d3e6; border-color: rgba(255,255,255,0.25); }

  @keyframes dropIn{
    from{ opacity:0; transform: translateY(-16px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes slideInLeft{
    from{ opacity:0; transform: translateX(-36px); }
    to{ opacity:1; transform: translateX(0); }
  }
  @keyframes slideInRight{
    from{ opacity:0; transform: translateX(36px); }
    to{ opacity:1; transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce){
    nav, .badge, .badge .dot, h1 .line, p.sub, .cta-btn, a.secondary{
      animation:none !important; opacity:1 !important; transform:none !important;
    }
    .spotlight, .blob{ display:none; }
  }

  @media (hover:none){
    .spotlight{ display:none; }
  }
</style>
</head>
<body>

  <div class="spotlight"></div>
  <div class="aurora"></div>
  <div class="blob b1" id="blob1"></div>
  <div class="blob b2" id="blob2"></div>
  <div class="blob b3"></div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>

  <nav>
    <div class="brand">
      <div class="mark"><img src="https://files.catbox.moe/cj1vkw.jpeg" alt="KeenanDev"></div>
      <div class="name">KeenanDev</div>
    </div>
    <div class="nav-right">
      <button class="nav-cta" id="navGetStartedBtn">Get Started</button>
    </div>
  </nav>

  <main>
    <div class="badge"><span class="dot"></span> Premium Generator untuk Alight Motion</div>

    <h1>
      <span class="line line1">Unlock Premium</span>
      <span class="line line2">Alight Motion</span>
      <span class="line line3">100% Free</span>
    </h1>

    <p class="sub">
      Dapatkan akses premium Alight Motion tanpa biaya. Klik tombol di bawah untuk lanjut.
    </p>

    <div class="actions">
      <button class="cta-btn" id="mainGetStartedBtn">Get Started <span class="arrow">→</span></button>
      <a class="secondary" href="https://keenandev.my.id" target="_blank">Penasaran developernya? <b>Web Developer</b></a>
    </div>
  </main>

<script>
  // ===== REDIRECT KE TARGET (langsung, tanpa preview) =====
  const TARGET_URL = 'https://utamaam.keenandev.my.id';

  function goToTarget(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
    // redirect setelah ripple
    setTimeout(() => {
      window.location.href = TARGET_URL;
    }, 180);
  }

  document.getElementById('navGetStartedBtn').addEventListener('click', goToTarget);
  document.getElementById('mainGetStartedBtn').addEventListener('click', goToTarget);

  // ===== cursor-follow spotlight + blob parallax =====
  const root = document.documentElement;
  const blob1 = document.getElementById('blob1');
  const blob2 = document.getElementById('blob2');

  window.addEventListener('mousemove', (e) => {
    const xPct = (e.clientX / window.innerWidth) * 100;
    const yPct = (e.clientY / window.innerHeight) * 100;
    root.style.setProperty('--mx', xPct + '%');
    root.style.setProperty('--my', yPct + '%');

    const dx = (e.clientX / window.innerWidth - 0.5) * 24;
    const dy = (e.clientY / window.innerHeight - 0.5) * 24;
    blob1.style.transform = `translate(${dx}px, ${dy}px)`;
    blob2.style.transform = `translate(${-dx}px, ${-dy}px)`;
  });

  // ===== floating particles =====
  const particlesEl = document.getElementById('particles');
  const count = 34;
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*5) + 's';
    s.style.animationDuration = (4 + Math.random()*4) + 's';
    particlesEl.appendChild(s);
  }
</script>

</body>
</html>
